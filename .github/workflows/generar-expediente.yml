# Genera el expediente del proyecto de ejemplo en cada cambio (o a pedido) y lo deja como artefacto descargable
# en la pestaña "Actions" de GitHub. Sirve para comprobar que nada se rompió.
name: Generar expediente

on:
  workflow_dispatch:
    inputs:
      proyecto:
        description: "Ruta del proyecto.yaml"
        default: "proyectos/chacachaca-cuturapi-yunguyo/proyecto.yaml"
  push:
    paths: ["src/**", "proyectos/**", "generar.py", "requirements.txt"]

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LibreOffice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc libreoffice-writer
      - name: Dependencias
        run: pip install -r requirements.txt
      - name: Generar
        run: python generar.py "${{ github.event.inputs.proyecto || 'proyectos/chacachaca-cuturapi-yunguyo/proyecto.yaml' }}" --salida salida/ci
      - uses: actions/upload-artifact@v4
        with:
          name: expediente
          path: salida/ci/ZIPS/*_COMPLETO.zip
          retention-days: 14
